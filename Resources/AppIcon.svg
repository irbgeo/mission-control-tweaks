<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Mission Control style window grid -->
  <!-- Top-left window -->
  <rect x="92" y="110" width="168" height="120" rx="18" fill="#5aa9ff"/>
  <!-- Top-right window with close button -->
  <rect x="284" y="110" width="136" height="120" rx="18" fill="#7ee0a6"/>
  <!-- Bottom window spanning width -->
  <rect x="92" y="254" width="328" height="148" rx="18" fill="#c9b3ff"/>

  <!-- Window title bar dots on top-left window -->
  <circle cx="116" cy="134" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="134" cy="134" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="152" cy="134" r="6" fill="#ffffff" opacity="0.6"/>

  <!-- Close button "×" on top-right window -->
  <circle cx="396" cy="134" r="20" fill="#ff6b6b"/>
  <path d="M388 126 L404 142 M404 126 L388 142" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Dock hint: a small bar at the bottom -->
  <rect x="176" y="430" width="160" height="22" rx="11" fill="#ffffff" opacity="0.35"/>
</svg>
